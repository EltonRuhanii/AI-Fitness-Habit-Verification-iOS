name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  core-tests:
    name: DisciplineCore unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path Packages/DisciplineCore

  functions-tests:
    name: Cloud Functions (AI verification) unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  rules-tests:
    name: Firestore & Storage security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test

  ios-build:
    name: iOS app build (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Discipline.xcodeproj \
            -scheme Discipline \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Report compiler errors as annotations
        if: failure()
        run: |
          # Workflow-command annotations are readable via the public API, unlike raw logs.
          grep -E ": error: " build.log | sed -E 's#^.*/(Discipline|Packages)/#\1/#' | sort -u | head -40 > errors.txt || true
          if [ -s errors.txt ]; then
            echo "::error title=Compiler errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' errors.txt)"
          else
            echo "::error title=Build failed::$(grep -E 'error|failed|FAILED' build.log | tail -20 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build.log

  ios-ui-tests:
    name: iOS UI tests (simulator, demo mode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted(k for k in devices if 'iOS' in k)
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid']); break
          ")
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Discipline.xcodeproj \
            -scheme Discipline \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO | tee test.log | grep -E "Test Case|error:|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log
          # Guard against a vacuous pass: the end-to-end flows must actually have run and passed.
          PASSED=$(grep -cE "Test [Cc]ase .*DisciplineUITests.* passed" test.log || true)
          echo "UI tests passed: $PASSED"
          echo "::notice title=UI tests::$PASSED UI test(s) passed"
          test "$PASSED" -ge 2
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E "error:|failed|FAILED" test.log | sed -E 's#^.*/(Discipline[A-Za-z]*|Packages)/#\1/#' | sort -u | head -40 > failures.txt || true
          echo "::error title=UI test failures::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' failures.txt)"
